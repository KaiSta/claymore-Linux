<!-- rog-claymore-linux : the keyboard panel, window and launcher icon.

     The same emblem is drawn at runtime with cairo (gui/icon.cpp), so nothing
     has to be installed for the window and panel icons to work. This file is
     for the desktop entry, the launcher and the package, and it holds the same
     geometry: three contours traced from the red mask of the source bitmap -
     the feather, the middle cluster and the blade.

     It is an emblem in the Republic of Gamers idiom, in ROG red. -->
